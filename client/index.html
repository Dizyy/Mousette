<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PhoneMouse</title>
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PhoneMouse">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="status" id="status" aria-live="polite">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.25 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
      </button>
    </header>

    <div class="pad-row">
      <main id="trackpad" aria-label="Trackpad">
        <div class="hint" id="hint">
          Drag to move · Tap to click · Double-tap to double-click<br>
          Two-finger tap: right-click · Two-finger drag: scroll<br>
          Hold, then drag: click-drag
        </div>
        <div class="drag-badge" id="drag-badge">Dragging</div>
      </main>
      <div id="scroll-strip" aria-label="Scroll strip" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-5 5h10l-5-5Zm0 14 5-5H7l5 5Z"/></svg>
      </div>
    </div>

    <nav class="bottombar">
      <button class="bar-btn" data-action="left" aria-label="Left click">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7v6a7 7 0 0 0 14 0V9a7 7 0 0 0-7-7Zm-1 2.08V10H7V9a5 5 0 0 1 4-4.92Z"/></svg>
        <span>Left</span>
      </button>
      <button class="bar-btn" data-action="right" aria-label="Right click">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7v6a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7Zm1 2.08V10h4V9a5 5 0 0 0-4-4.92Z"/></svg>
        <span>Right</span>
      </button>
      <button class="bar-btn" data-action="keyboard" id="keyboard-btn" aria-label="Keyboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-9 3h2v2h-2V8Zm0 3h2v2h-2v-2ZM8 8h2v2H8V8Zm0 3h2v2H8v-2ZM7 13H5v-2h2v2Zm0-3H5V8h2v2Zm9 7H8v-2h8v2Zm0-4h-2v-2h2v2Zm0-3h-2V8h2v2Zm3 3h-2v-2h2v2Zm0-3h-2V8h2v2Z"/></svg>
        <span>Keys</span>
      </button>
      <button class="bar-btn" data-action="search" aria-label="Search (Win+S)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
        <span>Search</span>
      </button>
      <button class="bar-btn" data-action="alttab" aria-label="Alt+Tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12v10H3V5Zm2 2v6h8V7H5Zm12 2h4v10H9v-2h10v-6h-2V9Z"/></svg>
        <span>Alt+Tab</span>
      </button>
      <button class="bar-btn" data-action="desktop" aria-label="Show desktop (Win+D)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 13H3V5h18v11Z"/></svg>
        <span>Desktop</span>
      </button>
      <button class="bar-btn" data-action="esc" aria-label="Escape">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"/></svg>
        <span>Esc</span>
      </button>
    </nav>
  </div>

  <!-- Receives iOS keyboard input. Kept on screen (but invisible) so iOS will focus it. -->
  <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" enterkeyhint="enter" aria-label="Keyboard input">

  <div class="sheet" id="settings" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <label class="field">
        <span>Cursor sensitivity <output id="sens-val"></output></span>
        <input type="range" id="sens" min="0.3" max="3" step="0.1">
      </label>
      <label class="field">
        <span>Scroll speed <output id="scroll-val"></output></span>
        <input type="range" id="scroll" min="0.2" max="3" step="0.1">
      </label>
      <label class="field toggle">
        <span>Scroll strip on the right edge</span>
        <input type="checkbox" id="strip">
      </label>
      <h3 class="section-title">PC</h3>
      <div class="pc-actions">
        <button class="text-btn" id="taskmgr-btn">Task Manager</button>
        <button class="text-btn danger" id="shutdown-btn">Shut down PC</button>
        <button class="text-btn" id="cancel-shutdown-btn">Cancel shutdown</button>
      </div>
      <div class="sheet-actions">
        <button class="primary-btn" id="settings-close">Done</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="pin-sheet" hidden>
    <form class="sheet-card" id="pin-form" role="dialog" aria-modal="true" aria-labelledby="pin-title">
      <h2 id="pin-title">Enter PIN</h2>
      <p class="muted">The 6-digit PIN is shown in the PhoneMouse window on your PC.</p>
      <input id="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" placeholder="••••••" aria-label="PIN">
      <p class="error" id="pin-error" hidden></p>
      <button class="primary-btn wide" type="submit">Connect</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button class="toast-btn" id="toast-btn" hidden></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
